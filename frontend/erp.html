<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo ERP - Balança & Pátio | SE7 Terminais</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar Padronizada SE7 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center text-white" href="dashboard.html">
        <img src="assets/se7logo.png" alt="Logo SE7 Terminais" height="30" class="me-2" style="filter: brightness(0) invert(1);">
        <span class="fw-bolder fs-4" style="letter-spacing: 1px;">SE7</span>
        <span class="fw-normal ms-1 fs-5">Terminais - ERP / Balança</span>
      </a>
      
      <div class="d-flex align-items-center gap-3">
        <span id="usuarioInfo" class="text-white small fw-semibold"></span>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i>Painel Operacional</a>
        <button id="btnAdmin" class="btn btn-outline-light btn-sm d-none" onclick="window.location.href='admin.html'"><i class="bi bi-shield-lock me-1"></i>Admin</button>
        <button class="btn btn-danger btn-sm fw-bold" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal do ERP -->
  <div class="container-fluid px-4 py-4">
    
    <!-- Cabeçalho de Ações e Filtros -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 bg-body p-3 rounded shadow-sm border">
      <h4 class="mb-2 mb-md-0 fw-bold text-body"><i class="bi bi-truck text-primary me-2"></i>Controle de Pesagem & Pátio</h4>
      
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <div class="input-group" style="max-width: 300px;">
          <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
          <input type="text" id="pesquisaErp" class="form-control" placeholder="Buscar placa, ticket ou motorista...">
        </div>
        
        <button class="btn btn-outline-secondary" onclick="carregarPesagens()"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="btn btn-success fw-bold" onclick="abrirModalPesagem()"><i class="bi bi-plus-lg me-1"></i>Nova Pesagem</button>
      </div>
    </div>

    <!-- Tabela de Movimentações / Balança -->
    <div class="card border shadow-sm bg-body">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Ticket #</th>
                <th>Placa Cavalo</th>
                <th>Motorista</th>
                <th>Produto</th>
                <th>Tara (t)</th>
                <th>Bruto (t)</th>
                <th>Líquido (t)</th>
                <th>Status</th>
                <th class="text-end pe-4">Ações</th>
              </tr>
            </thead>
            <tbody id="tbodyPesagens">
              <tr>
                <td colspan="9" class="text-center py-5 text-muted">Carregando dados operacionais...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Nova Pesagem / Movimentação -->
  <div class="modal fade" id="modalPesagem" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-body">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold text-primary" id="tituloModalPesagem">Registrar Pesagem / Balança</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formPesagem">
            <input type="hidden" id="pesagemId">
            
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold text-body-secondary">ID Agendamento ou Placa</label>
                <input type="text" id="buscaAgendamento" class="form-control bg-body" placeholder="Ex: ABC-1234" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-body-secondary">Operação de Balança</label>
                <select id="tipoOperacao" class="form-select bg-body" required>
                  <option value="">Selecione...</option>
                  <option value="TARA">1. Pesagem de Tara (Entrada Vazio)</option>
                  <option value="BRUTO">2. Pesagem de Bruto (Saída Carregado)</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold text-body-secondary">Peso Registrado (Ton)</label>
                <input type="number" id="valorPeso" class="form-control bg-body" step="0.01" min="0" required placeholder="0.00">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-body-secondary">Observações da Balança</label>
                <input type="text" id="obsPesagem" class="form-control bg-body" placeholder="Lacre, avarias ou detalhes...">
              </div>
            </div>
            
            <div class="mt-4 text-end border-top pt-3">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success fw-bold px-4" id="btnSalvarPesagem">
                <span class="spinner-border spinner-border-sm d-none me-1" id="spinnerPesagem" role="status"></span>
                <span>Salvar Pesagem</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>

  <script>
    const API = 'https://se7-backend.onrender.com/api';
    const token = localStorage.getItem('token');
    let modalPesagemInstance;

    if (!token) window.location.href = 'login.html';

    window.onload = function () {
      modalPesagemInstance = new bootstrap.Modal(document.getElementById('modalPesagem'));
      carregarUsuarioERP();
      carregarPesagens();
    };

    function carregarUsuarioERP() {
      const payload = lerTokenSeguro(token);
      if (payload) {
        document.getElementById('usuarioInfo').textContent = `${payload.nome} (${payload.perfil})`;
        if (payload.perfil === 'admin') {
          document.getElementById('btnAdmin').classList.remove('d-none');
        }
      }
    }

    function abrirModalPesagem() {
      document.getElementById('formPesagem').reset();
      document.getElementById('pesagemId').value = '';
      modalPesagemInstance.show();
    }

    async function carregarPesagens() {
      try {
        // Exemplo seguro utilizando fetchAutenticado do utils.js
        const res = await fetchAutenticado(`${API}/pesagens`);
        if (!res) return;

        const dados = await res.json();
        const tbody = document.getElementById('tbodyPesagens');

        if (!dados || !Array.isArray(dados) || dados.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="9" class="text-center py-5">
                <i class="bi bi-clipboard-x text-body-tertiary" style="font-size: 3rem;"></i>
                <h6 class="mt-3 text-body-secondary fw-bold">Nenhuma pesagem registrada hoje</h6>
                <p class="text-body-tertiary mb-0">Utilize o botão "Nova Pesagem" para iniciar o fluxo na balança.</p>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = '';
        dados.forEach(p => {
          tbody.innerHTML += `
            <tr>
              <td class="ps-3 fw-bold text-primary">#${p.id || '-'}</td>
              <td><span class="badge bg-secondary">${p.placacavalo || '-'}</span></td>
              <td>${p.motorista || '-'}</td>
              <td>${p.produto || '-'}</td>
              <td>${p.tara || '0.00'} t</td>
              <td>${p.bruto || '0.00'} t</td>
              <td class="fw-bold text-success">${p.liquido || '0.00'} t</td>
              <td><span class="badge bg-info text-dark">${p.status || 'Em andamento'}</span></td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-primary me-1" title="Editar"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" title="Excluir"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          `;
        });
      } catch (error) {
        console.error("Erro ao carregar pesagens:", error);
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
