<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - SE7 Terminais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel-bg:#ffffff; --text-main:#1d2433; --text-muted:#5b6578;
  --accent:#0d6efd; --accent-hover:#0b5ed7; --line:#dfe4ec;
  --font-body:"Lexend", system-ui, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text-main);height:100vh;overflow:hidden}

.login-container{
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100vh;
  width: 100vw;
  position: relative;
}

/* Painel de Imagem com efeito de transição suave (Fade & Slide) */
.side-image{
  position: relative;
  background-position: center;
  background-size: cover;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 60px;
  color: #fff;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease-in-out;
  grid-column: 1; /* Padrão: Esquerda */
}
.side-image::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,rgba(0,0,0,0.7) 100%);}
.side-image-content{position:relative;z-index:2; transition: opacity 0.3s ease;}
.side-image h1{font-size:2.5rem;font-weight:700;margin:0 0 10px 0;letter-spacing:-0.02em;}
.side-image p{font-size:1.1rem;margin:0;opacity:0.9;font-weight:300;}

/* Painel do Formulário */
.side-form{
  background: var(--panel-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  position: relative;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  grid-column: 2; /* Padrão: Direita */
}

/* Modo ERP Ativo: Inverte as colunas visualmente com animação */
.login-container.erp-mode .side-image{
  grid-column: 2; /* Move para a Direita */
}
.login-container.erp-mode .side-form{
  grid-column: 1; /* Move para a Esquerda */
}

.form-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px; transition: opacity 0.3s ease;}
.form-title{font-size:1.75rem;font-weight:600;color:#0d6efd;margin:0;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:0.85rem;color:var(--text-muted);font-weight:500;}
.input{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:12px 14px;font-size:0.95rem;color:var(--text-main);width:100%;transition:border-color 0.2s;}
.input:focus{border-color:var(--accent);outline:none;background:#fff;box-shadow:0 0 0 3px rgba(13,110,253,0.15);}

.btn-submit{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:background 0.2s;}
.btn-submit:hover{background:var(--accent-hover);}

.form-footer{display:flex;flex-direction:column;gap:12px;font-size:0.85rem;text-align:center;margin-top:10px;}
.form-footer a{color:var(--accent);text-decoration:none;font-weight:500;}
.form-footer a:hover{text-decoration:underline;}

/* Botão Flutuante de Alternância */
.switch-mode-btn{position:absolute;top:24px;right:24px;background:#f1f5f9;border:1px solid var(--line);color:var(--text-main);padding:8px 16px;border-radius:20px;font-size:0.85rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;z-index:10;}
.login-container.erp-mode ~ .switch-mode-btn, body .switch-mode-btn{transition: all 0.4s ease;}
.switch-mode-btn:hover{background:#e2e8f0;}

@media(max-width:900px){
  .login-container, .login-container.erp-mode{grid-template-columns:1fr;}
  .side-image{display:none;}
}
</style>
</head>
<body>

<button type="button" class="switch-mode-btn" id="btnSwitch" onclick="toggleMode()">
  <i class="bi bi-arrow-repeat"></i> <span id="switchText">Mudar para ERP Logístico</span>
</button>

<div class="login-container" id="loginContainer">
  <!-- IMAGEM DE FUNDO -->
  <div class="side-image" id="sideImageBg" style="background-image: url('https://images.unsplash.com/photo-1578575437130-527eed3abbec?q=80&w=1920&auto=format&fit=crop');">
    <div class="side-image-content" id="imageContent">
      <h1 id="imgTitle">SE7 Terminais</h1>
      <p id="imgSubtitle">Gestão de Agendamentos</p>
    </div>
  </div>

  <!-- FORMULÁRIO DE LOGIN -->
  <div class="side-form" id="sideForm">
    <div class="form-box" id="formBox">
      <h2 class="form-title" id="formTitle">Acesso ao Sistema</h2>
      
      <form id="loginForm" style="display:flex;flex-direction:column;gap:16px">
        <div class="field">
          <label for="email">E-mail</label>
          <input class="input" type="email" id="email" required placeholder="Digite seu acesso">
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input class="input" type="password" id="senha" required placeholder="********">
        </div>
        <button type="submit" class="btn-submit" id="btnSubmitText">Entrar</button>
      </form>

      <div class="form-footer" id="formFooter">
        <a href="#"><i class="bi bi-geo-alt"></i> Rastrear Carga Sem Login</a>
        <div>Não possui conta? <a href="#">Cadastrar usuário</a></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const API = 'https://se7-backend.onrender.com/api';
let isErpMode = false;

const IMG_AGENDAMENTO = 'https://images.unsplash.com/photo-1578575437130-527eed3abbec?q=80&w=1920&auto=format&fit=crop';
const IMG_ERP = 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1920&auto=format&fit=crop';

function toggleMode() {
  isErpMode = !isErpMode;
  const container = document.getElementById('loginContainer');
  const title = document.getElementById('formTitle');
  const imgTitle = document.getElementById('imgTitle');
  const imgSubtitle = document.getElementById('imgSubtitle');
  const switchText = document.getElementById('switchText');
  const formFooter = document.getElementById('formFooter');
  const emailInput = document.getElementById('email');
  const sideImageBg = document.getElementById('sideImageBg');
  const imageContent = document.getElementById('imageContent');
  const formBox = document.getElementById('formBox');

  // Efeito fade out rápido antes de trocar o conteúdo e a imagem
  imageContent.style.opacity = 0;
  formBox.style.opacity = 0;

  setTimeout(() => {
    if (isErpMode) {
      container.classList.add('erp-mode');
      title.textContent = 'ERP Logístico';
      imgTitle.textContent = 'SE7 Terminais';
      imgSubtitle.textContent = 'ERP Logístico & Balança';
      switchText.textContent = 'Voltar para Agendamentos';
      sideImageBg.style.backgroundImage = `url('${IMG_ERP}')`;
      formFooter.style.display = 'none';
      emailInput.value = 'admin@empresa.com';
    } else {
      container.classList.remove('erp-mode');
      title.textContent = 'Acesso ao Sistema';
      imgTitle.textContent = 'SE7 Terminais';
      imgSubtitle.textContent = 'Gestão de Agendamentos';
      switchText.textContent = 'Mudar para ERP Logístico';
      sideImageBg.style.backgroundImage = `url('${IMG_AGENDAMENTO}')`;
      formFooter.style.display = 'flex';
      emailInput.value = '';
    }

    // Fade in do novo conteúdo
    imageContent.style.opacity = 1;
    formBox.style.opacity = 1;
  }, 300);
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;

  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const data = await res.json();

    if (res.ok && data.token) {
      localStorage.setItem('token', data.token);
      window.location.href = isErpMode ? 'erp.html' : 'dashboard.html';
    } else {
      Swal.fire('Atenção', data.erro || 'Credenciais inválidas', 'warning');
    }
  } catch (err) {
    Swal.fire('Erro', 'Não foi possível conectar ao servidor.', 'error');
  }
});
</script>
</body>
</html>
