<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - SE7 Terminais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel-bg:#ffffff; --text-main:#1d2433; --text-muted:#5b6578;
  --accent:#0d6efd; --accent-hover:#0b5ed7; --line:#dfe4ec;
  --font-body:"Lexend", system-ui, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text-main);height:100vh;overflow:hidden}

/* Wrapper externo trava o overflow para não criar scroll horizontal */
.viewport-wrapper {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

/* Contentor com o dobro da largura que desliza de forma fluida */
.login-container{
  display: flex;
  width: 200vw;
  height: 100vh;
  transition: transform 0.7s cubic-bezier(0.77, 0, 0.175, 1);
}

.login-container.erp-mode {
  transform: translateX(-100vw);
}

/* Cada painel ocupa exatamente 100vw e divide-se em 2 colunas */
.pane {
  width: 100vw;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  flex-shrink: 0;
}

/* Painel da Imagem */
.side-image{
  position: relative;
  background-position: center;
  background-size: cover;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 60px;
  color: #fff;
}
.side-image::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,rgba(0,0,0,0.7) 100%);}
.side-image-content{position:relative;z-index:2;}
.side-image h1{font-size:2.5rem;font-weight:700;margin:0 0 10px 0;letter-spacing:-0.02em;}
.side-image p{font-size:1.1rem;margin:0;opacity:0.9;font-weight:300;}

/* Painel do Formulário */
.side-form{
  background: var(--panel-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  position: relative;
}

.form-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px;}
.form-title{font-size:1.75rem;font-weight:600;color:#0d6efd;margin:0;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:0.85rem;color:var(--text-muted);font-weight:500;}
.input{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:12px 14px;font-size:0.95rem;color:var(--text-main);width:100%;transition:border-color 0.2s;}
.input:focus{border-color:var(--accent);outline:none;background:#fff;box-shadow:0 0 0 3px rgba(13,110,253,0.15);}

.btn-submit{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:background 0.2s;}
.btn-submit:hover{background:var(--accent-hover);}

.form-footer{display:flex;flex-direction:column;gap:12px;font-size:0.85rem;text-align:center;margin-top:10px;}
.form-footer a{color:var(--accent);text-decoration:none;font-weight:500;}
.form-footer a:hover{text-decoration:underline;}

/* Botão Flutuante de Alternância Fixo */
.switch-mode-btn{position:fixed;top:24px;right:24px;background:#f1f5f9;border:1px solid var(--line);color:var(--text-main);padding:8px 16px;border-radius:20px;font-size:0.85rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;z-index:100;}
.switch-mode-btn:hover{background:#e2e8f0;}

@media(max-width:900px){
  .pane{grid-template-columns:1fr;}
  .side-image{display:none;}
  .login-container{width:100vw; transform:none !important;}
}
</style>
</head>
<body>

<button type="button" class="switch-mode-btn" id="btnSwitch" onclick="toggleMode()">
  <i class="bi bi-arrow-repeat"></i> <span id="switchText">Mudar para ERP Logístico</span>
</button>

<div class="viewport-wrapper">
  <div class="login-container" id="loginContainer">
    
    <!-- PANE 1: MODO AGENDAMENTO (Imagem Esquerda, Form Direita) -->
    <div class="pane">
      <div class="side-image" style="background-image: url('https://images.unsplash.com/photo-1578575437130-527eed3abbec?q=80&w=1920&auto=format&fit=crop');">
        <div class="side-image-content">
          <h1>SE7 Terminais</h1>
          <p>Gestão de Agendamentos</p>
        </div>
      </div>
      <div class="side-form">
        <div class="form-box">
          <h2 class="form-title">Acesso ao Sistema</h2>
          <form id="loginFormAgendamento" onsubmit="realizarLogin(event, false)" style="display:flex;flex-direction:column;gap:16px">
            <div class="field">
              <label>E-mail</label>
              <input class="input" type="email" id="emailAgendamento" required placeholder="Digite seu acesso">
            </div>
            <div class="field">
              <label>Senha</label>
              <input class="input" type="password" id="senhaAgendamento" required placeholder="********">
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
          </form>
          <div class="form-footer">
            <a href="#"><i class="bi bi-geo-alt"></i> Rastrear Carga Sem Login</a>
            <div>Não possui conta? <a href="#">Cadastrar usuário</a></div>
          </div>
        </div>
      </div>
    </div>

    <!-- PANE 2: MODO ERP (Form Esquerda, Imagem Direita) -->
    <div class="pane">
      <div class="side-form">
        <div class="form-box">
          <h2 class="form-title">Acesso ao ERP Logístico</h2>
          <form id="loginFormErp" onsubmit="realizarLogin(event, true)" style="display:flex;flex-direction:column;gap:16px">
            <div class="field">
              <label>E-mail de Operador / Admin</label>
              <input class="input" type="email" id="emailErp" value="admin@empresa.com" required placeholder="admin@empresa.com">
            </div>
            <div class="field">
              <label>Senha</label>
              <input class="input" type="password" id="senhaErp" value="123456" required placeholder="********">
            </div>
            <button type="submit" class="btn-submit">Entrar no ERP</button>
          </form>
        </div>
      </div>
      <div class="side-image" style="background-image: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1920&auto=format&fit=crop');">
        <div class="side-image-content">
          <h1>SE7 Terminais</h1>
          <p>ERP Logístico &amp; Balança</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const API = 'https://se7-backend.onrender.com/api';
let isErpMode = false;

function toggleMode() {
  isErpMode = !isErpMode;
  const container = document.getElementById('loginContainer');
  const switchText = document.getElementById('switchText');

  if (isErpMode) {
    container.classList.add('erp-mode');
    switchText.textContent = 'Voltar para Agendamentos';
  } else {
    container.classList.remove('erp-mode');
    switchText.textContent = 'Mudar para ERP Logístico';
  }
}

// Função auxiliar para ler o payload do JWT no frontend com segurança
function lerTokenSeguro(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch (e) {
    return null;
  }
}

async function realizarLogin(e, isErp) {
  e.preventDefault();
  const email = document.getElementById(isErp ? 'emailErp' : 'emailAgendamento').value;
  const senha = document.getElementById(isErp ? 'senhaErp' : 'senhaAgendamento').value;

  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const data = await res.json();

    if (res.ok && data.token) {
      const payload = lerTokenSeguro(data.token);
      const perfil = payload?.perfil || 'usuario';

      // Validação restrita: ERP apenas para Admin/Operador
      if (isErp && perfil !== 'admin') {
        Swal.fire('Acesso Restrito', 'Esta conta não possui permissão de Administrador para aceder ao ERP.', 'warning');
        return;
      }

      localStorage.setItem('token', data.token);
      window.location.href = isErp ? 'erp.html' : 'dashboard.html';
    } else {
      Swal.fire('Atenção', data.erro || 'Credenciais inválidas', 'warning');
    }
  } catch (err) {
    Swal.fire('Erro', 'Não foi possível conectar ao servidor.', 'error');
  }
}
</script>
</body>
</html>
