<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - SE7 Terminais</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="dashboard.html"><i class="bi bi-shield-lock me-2"></i>SE7 - Controle de Segurança</a>
      <div class="d-flex align-items-center gap-3">
        <span id="usuarioInfo" class="text-white-50 small"></span>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i>Painel Operacional</a>
        <button class="btn btn-danger btn-sm fw-bold" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <div class="row g-4">
      
      <div class="col-lg-7">
        <div class="card border border-secondary-subtle shadow-sm bg-body h-100">
          <div class="card-header bg-transparent py-3 border-bottom border-secondary-subtle">
            <h5 class="card-title fw-bold m-0 text-dark"><i class="bi bi-people-fill me-2 text-primary"></i>Controle de Usuários</h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="ps-3">ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th>Status</th>
                    <th class="text-end pe-3">Ações</th>
                  </tr>
                </thead>
                <tbody id="tbodyUsuarios">
                  </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card border border-secondary-subtle shadow-sm bg-body h-100">
          <div class="card-header bg-transparent py-3 border-bottom border-secondary-subtle">
            <h5 class="card-title fw-bold m-0 text-dark"><i class="bi bi-journal-text me-2 text-warning"></i>Logs de Auditoria</h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
              <table class="table table-sm table-striped align-middle mb-0">
                <thead class="table-light position-sticky top-0">
                  <tr>
                    <th class="ps-3">Data/Hora</th>
                    <th>Operador</th>
                    <th>Ação Executada</th>
                  </tr>
                </thead>
                <tbody id="tbodyLogs">
                  </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const API = 'https://se7-backend.onrender.com/api';
    const token = localStorage.getItem('token');
    const usuarioLogado = JSON.parse(localStorage.getItem('usuario') || '{}');

    if (!token) window.location.href = 'login.html';

    // Trava de segurança no Frontend
    if (usuarioLogado.perfil !== 'admin') {
      Swal.fire({
        title: 'Acesso Restrito',
        text: 'Apenas administradores podem acessar esta página.',
        icon: 'warning',
        confirmButtonColor: '#0d6efd',
        confirmButtonText: 'Voltar ao Dashboard',
        allowOutsideClick: false
      }).then(() => {
        window.location.href = 'dashboard.html';
      });
    }

    window.onload = function () {
      if (usuarioLogado.perfil === 'admin') {
        document.getElementById('usuarioInfo').textContent = `${usuarioLogado.nome} (${usuarioLogado.email})`;
        carregarUsuarios();
        carregarLogs();
      }
    };

    async function carregarUsuarios() {
      try {
        const res = await fetch(`${API}/users`, { headers: { 'Authorization': `Bearer ${token}` } });
        const dados = await res.json();
        const tbody = document.getElementById('tbodyUsuarios');
        tbody.innerHTML = '';

        dados.forEach(u => {
          const ehOMesmoUsuario = u.id === usuarioLogado.id;
          
          // Estilização das Badges de Perfil e Status
          const badgePerfil = u.perfil === 'admin' ? 'bg-danger' : 'bg-secondary';
          const badgeStatus = u.ativo ? 'bg-success' : 'bg-dark';

          // Definição dos botões de ação dinâmicos
          const botaoPerfilHTML = u.perfil === 'admin' 
            ? `<button class="btn btn-xs btn-outline-secondary me-1" onclick="alterarPerfil('${u.id}', 'usuario')" ${ehOMesmoUsuario ? 'disabled title="Você não pode se rebaixar"' : 'title="Rebaixar para Usuário comum"'}><i class="bi bi-person-down"></i></button>`
            : `<button class="btn btn-xs btn-outline-danger me-1" onclick="alterarPerfil('${u.id}', 'admin')" title="Promover a Admin"><i class="bi bi-shield-check"></i></button>`;

          const botaoStatusHTML = u.ativo
            ? `<button class="btn btn-xs btn-outline-dark" onclick="alterarStatus('${u.id}', true)" ${ehOMesmoUsuario ? 'disabled title="Você não pode se desativar"' : 'title="Desativar Conta"'}><i class="bi bi-person-x"></i></button>`
            : `<button class="btn btn-xs btn-outline-success" onclick="alterarStatus('${u.id}', false)" title="Ativar Conta"><i class="bi bi-person-check"></i></button>`;

          tbody.innerHTML += `
            <tr class="${ehOMesmoUsuario ? 'table-info' : ''}">
              <td class="ps-3 text-muted fw-bold">#${u.id}</td>
              <td class="fw-semibold">${u.nome} ${ehOMesmoUsuario ? '<span class="badge bg-info text-dark ms-1">Você</span>' : ''}</td>
              <td><small>${u.email}</small></td>
              <td><span class="badge ${badgePerfil}">${u.perfil}</span></td>
              <td><span class="badge ${badgeStatus}">${u.ativo ? 'Ativo' : 'Inativo'}</span></td>
              <td class="text-end pe-3">
                ${botaoPerfilHTML}
                ${botaoStatusHTML}
              </td>
            </tr>
          `;
        });
      } catch (erro) {
        Swal.fire('Erro!', 'Não foi possível carregar a lista de usuários.', 'error');
      }
    }

    // INTERAÇÃO: ALTERAR PERFIL (PROMOVER / REBAIXAR)
    async function alterarPerfil(id, perfilAtual) {
      const novoPerfil = perfilAtual === 'admin' ? 'usuario' : 'admin';
      const mensagemTexto = novoPerfil === 'admin' 
        ? 'Este usuário passará a ter privilégios totais de Administrador.' 
        : 'Este usuário perderá os privilégios administrativos.';

      const confirmacao = await Swal.fire({
        title: `Confirmar alteração de perfil?`,
        text: mensagemTexto,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#0d6efd',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sim, alterar!',
        cancelButtonText: 'Cancelar'
      });

      if (confirmacao.isConfirmed) {
        try {
          const res = await fetch(`${API}/users/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ perfil: novoPerfil })
          });

          if (res.ok) {
            Swal.fire('Sucesso!', 'Perfil modificado com sucesso no banco.', 'success');
            carregarUsuarios();
            carregarLogs(); // Atualiza a auditoria em tempo real
          } else {
            Swal.fire('Erro', 'Não foi possível processar a alteração.', 'error');
          }
        } catch (error) {
          Swal.fire('Ops!', 'Erro na conexão com o servidor.', 'error');
        }
      }
    }

    // INTERAÇÃO: ALTERAR STATUS (ATIVAR / DESATIVAR)
    async function alterarStatus(id, statusAtivo) {
      const novoStatus = !statusAtivo;
      
      const confirmacao = await Swal.fire({
        title: novoStatus ? 'Ativar usuário?' : 'Desativar usuário?',
        text: novoStatus ? 'O usuário recuperará o direito de login.' : 'O usuário será bloqueado e não conseguirá mais logar.',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: novoStatus ? '#198754' : '#212529',
        cancelButtonColor: '#6c757d',
        confirmButtonText: novoStatus ? 'Sim, ativar!' : 'Sim, bloquear!',
        cancelButtonText: 'Cancelar'
      });

      if (confirmacao.isConfirmed) {
        try {
          const res = await fetch(`${API}/users/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ ativo: novoStatus })
          });

          if (res.ok) {
            Swal.fire('Concluído!', `Status atualizado com sucesso.`, 'success');
            carregarUsuarios();
            carregarLogs();
          } else {
            Swal.fire('Erro', 'Falha ao atualizar o status.', 'error');
          }
        } catch (error) {
          Swal.fire('Ops!', 'Erro na conexão com o servidor.', 'error');
        }
      }
    }

    async function carregarLogs() {
      try {
        const res = await fetch(`${API}/logs`, { headers: { 'Authorization': `Bearer ${token}` } });
        const dados = await res.json();
        const tbody = document.getElementById('tbodyLogs');
        tbody.innerHTML = '';

        if (!dados.length) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3 text-muted">Nenhum log registrado.</td></tr>';
          return;
        }

        dados.forEach(log => {
          tbody.innerHTML += `
            <tr>
              <td class="ps-3"><small class="text-secondary">${new Date(log.dataHora).toLocaleString('pt-BR')}</small></td>
              <td><small class="fw-semibold">${log.usuario}</small></td>
              <td><small class="text-dark">${log.acao}</small></td>
            </tr>
          `;
        });
      } catch (erro) {
        console.error('Erro ao listar logs:', erro);
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
