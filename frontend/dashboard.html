<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Agendamentos</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center text-white" href="#">
        <img src="assets/se7logo.png" alt="Logo SE7 Terminais" height="30" class="me-2" style="filter: brightness(0) invert(1);">
        <span class="fw-bolder fs-4" style="letter-spacing: 1px;">SE7</span>
        <span class="fw-normal ms-1 fs-5">Terminais</span>
      </a>
      
      <div class="d-flex align-items-center gap-3">
        <a href="perfil.html" id="nomeUsuario" class="text-white fw-semibold text-decoration-none btn btn-link"></a>
        <button id="btnAdmin" class="btn btn-outline-light btn-sm d-none" onclick="window.location.href='admin.html'">Admin</button>
        <button class="btn btn-danger btn-sm fw-bold" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 bg-body p-3 rounded shadow-sm border">
      <h4 class="mb-2 mb-md-0 fw-bold text-body">Meus Agendamentos</h4>
      
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <div class="input-group" style="max-width: 300px;">
          <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
          <input type="text" id="pesquisa" class="form-control" placeholder="Buscar placa, cliente, DI...">
        </div>
        
        <button class="btn btn-outline-secondary" onclick="carregarAgendamentos()"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="btn btn-primary fw-bold" onclick="abrirFormulario()"><i class="bi bi-plus-lg me-1"></i>Novo</button>
      </div>
    </div>

    <div class="card border shadow-sm bg-body">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">ID</th>
                <th>Cliente</th>
                <th>Transportadora</th>
                <th>Placa Cavalo</th>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Status</th>
                <th class="text-end pe-4">Ações</th>
              </tr>
            </thead>
            <tbody id="tbodyAgendamentos">
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalAgendamento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content bg-body">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold text-primary" id="tituloFormulario">Novo Agendamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formAgendamento">
            <input type="hidden" id="agendamentoId">
            
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Tipo de Carga</label>
                <select id="tipoCarga" class="form-select bg-body" required>
                  <option value="">Selecione...</option>
                  <option>Granel</option>
                  <option>Bigbag 1000kg</option>
                  <option>Bigbag 500kg</option>
                  <option>Sacaria 50kg</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">DI</label>
                <input type="text" id="di" class="form-control bg-body mascara-di" placeholder="00/0000000-0" maxlength="12">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Pedido</label>
                <input type="text" id="pedido" class="form-control bg-body">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Data/Hora Prevista</label>
                <input type="datetime-local" id="dataHora" class="form-control bg-body">
              </div>

              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">CNPJ Cliente</label>
                <input type="text" id="cnpjCliente" class="form-control bg-body mascara-cnpj" placeholder="00.000.000/0000-00" maxlength="18">
              </div>
              <div class="col-md-9">
                <label class="form-label fw-semibold text-body-secondary">Nome do Cliente</label>
                <input type="text" id="cliente" class="form-control bg-body" required>
              </div>
              <div class="col-md-12">
                <label class="form-label fw-semibold text-body-secondary">Endereço do Cliente</label>
                <input type="text" id="endereco" class="form-control bg-body" readonly placeholder="Preenchimento automático...">
              </div>

              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">CNPJ Transportadora</label>
                <input type="text" id="cnpjTransportadora" class="form-control bg-body mascara-cnpj" maxlength="18">
              </div>
              <div class="col-md-9">
                <label class="form-label fw-semibold text-body-secondary">Transportadora</label>
                <input type="text" id="transportadora" class="form-control bg-body" required>
              </div>

              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">CPF Motorista</label>
                <input type="text" id="cpfMotorista" class="form-control bg-body mascara-cpf" maxlength="14">
              </div>
              <div class="col-md-9">
                <label class="form-label fw-semibold text-body-secondary">Nome do Motorista</label>
                <input type="text" id="motorista" class="form-control bg-body">
              </div>

              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Placa Cavalo</label>
                <input type="text" id="placaCavalo" class="form-control bg-body mascara-placa" maxlength="8">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Placa Carreta 1</label>
                <input type="text" id="placaCarreta1" class="form-control bg-body mascara-placa" maxlength="8">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Placa Carreta 2</label>
                <input type="text" id="placaCarreta2" class="form-control bg-body mascara-placa" maxlength="8">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Placa Carreta 3</label>
                <input type="text" id="placaCarreta3" class="form-control bg-body mascara-placa" maxlength="8">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold text-body-secondary">Produto</label>
                <input type="text" id="produto" class="form-control bg-body" required>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Qtd (Ton)</label>
                <input type="number" id="quantidade" class="form-control bg-body" min="0" step="0.01">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-body-secondary">Status</label>
                <select id="status" class="form-select bg-body">
                  <option>Agendado</option>
                  <option>Em andamento</option>
                  <option>Finalizado</option>
                </select>
              </div>

              <div class="col-md-12">
                <label class="form-label fw-semibold text-body-secondary">Observações</label>
                <textarea id="observacao" class="form-control bg-body" rows="2"></textarea>
              </div>
            </div>
            
            <div class="mt-4 text-end border-top pt-3">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success fw-bold px-4" id="btnSalvar">
                <span class="spinner-border spinner-border-sm d-none me-1" id="spinnerSalvar" role="status"></span>
                <span id="textoSalvar">Salvar Agendamento</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="utils.js"></script>

  <script>
    const API = 'https://se7-backend.onrender.com/api';
    const token = localStorage.getItem('token');
    let modalInstance;

    if (!token) window.location.href = 'login.html';

    window.onload = function () {
      // Força a remoção do tema escuro caso o navegador tenha salvo no localStorage
      localStorage.removeItem('tema_se7');
      
      modalInstance = new bootstrap.Modal(document.getElementById('modalAgendamento'));
      carregarUsuario();
      carregarAgendamentos();
      aplicarEventos();
    };

    // ==========================================
    // MELHORIA: BARRA DE PESQUISA INTELIGENTE
    // ==========================================
    document.getElementById('pesquisa').addEventListener('keyup', function(e) {
      const termo = e.target.value.toLowerCase();
      const linhas = document.querySelectorAll('.linha-dado');
      
      linhas.forEach(linha => {
        const textoDaLinha = linha.textContent.toLowerCase();
        linha.style.display = textoDaLinha.includes(termo) ? '' : 'none';
      });
    });

    function aplicarEventos() {
      document.getElementById('formAgendamento').addEventListener('submit', salvarAgendamento);
      document.getElementById('cnpjCliente').addEventListener('blur', buscarCNPJ);

      document.querySelectorAll('.mascara-cnpj').forEach(el => el.addEventListener('input', mascaraCNPJ));
      document.querySelectorAll('.mascara-cpf').forEach(el => el.addEventListener('input', mascaraCPF));
      document.querySelectorAll('.mascara-placa').forEach(el => el.addEventListener('input', mascaraPlaca));
      document.querySelectorAll('.mascara-di').forEach(el => el.addEventListener('input', mascaraDI));
    }

    function carregarUsuario() {
      const payload = lerTokenSeguro(token);
      
      if (payload) {
        document.getElementById('nomeUsuario').textContent = `${payload.nome} (${payload.perfil})`;
        if (payload.perfil === 'admin') {
          document.getElementById('btnAdmin').classList.remove('d-none');
        }
      }
    }

    function abrirFormulario() {
      document.getElementById('formAgendamento').reset();
      document.getElementById('agendamentoId').value = '';
      document.getElementById('tituloFormulario').textContent = 'Novo Agendamento';
      modalInstance.show();
    }

    async function carregarAgendamentos() {
      try {
        const res = await fetch(`${API}/agendamentos`, { headers: { Authorization: `Bearer ${token}` } });
        
        let dados;
        try {
            dados = await res.json();
        } catch(e) {
            dados = null;
        }

        const tbody = document.getElementById('tbodyAgendamentos');

        if (!res.ok || !dados || !Array.isArray(dados) || dados.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" class="text-center py-5">
                <i class="bi bi-inbox text-body-tertiary" style="font-size: 3.5rem;"></i>
                <h5 class="mt-3 text-body-secondary fw-bold">Nenhum agendamento encontrado</h5>
                <p class="text-body-tertiary mb-0">Crie seu primeiro agendamento clicando no botão "Novo".</p>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = '';
        dados.forEach(item => {
          let corBadge = 'bg-info text-dark';
          if (item.status === 'Finalizado') corBadge = 'bg-success';
          if (item.status === 'Em andamento') corBadge = 'bg-warning text-dark';

          tbody.innerHTML += `
            <tr class="linha-dado">
              <td class="ps-3 fw-bold text-body-secondary">#${item.id}</td>
              <td class="fw-semibold">${item.cliente || '-'}</td>
              <td>${item.transportadora || '-'}</td>
              <td><span class="badge bg-secondary border">${item.placaCavalo || '-'}</span></td>
              <td>${item.produto || '-'}</td>
              <td>${item.quantidade || '-'}</td>
              <td><span class="badge ${corBadge}">${item.status || 'Agendado'}</span></td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-primary" onclick='editarAgendamento(${JSON.stringify(item)})'><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick='excluirAgendamento("${item.id}")'><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          `;
        });
      } catch (error) {
        console.error("Erro real de comunicação:", error);
        Swal.fire('Ops!', 'Não foi possível conectar ao servidor.', 'error');
      }
    }

    function valor(id) { return document.getElementById(id).value; }

    function obterDadosFormulario() {
      return {
        tipoCarga: valor('tipoCarga'), di: valor('di'), pedido: valor('pedido'), dataHora: valor('dataHora'),
        cnpjCliente: valor('cnpjCliente'), cliente: valor('cliente'), endereco: valor('endereco'),
        cnpjTransportadora: valor('cnpjTransportadora'), transportadora: valor('transportadora'),
        cpfMotorista: valor('cpfMotorista'), motorista: valor('motorista'),
        placaCavalo: valor('placaCavalo'), placaCarreta1: valor('placaCarreta1'),
        placaCarreta2: valor('placaCarreta2'), placaCarreta3: valor('placaCarreta3'),
        produto: valor('produto'), quantidade: valor('quantidade'), status: valor('status'),
        observacao: valor('observacao')
      };
    }

    async function salvarAgendamento(e) {
      e.preventDefault();
      
      const btnSalvar = document.getElementById('btnSalvar');
      const spinner = document.getElementById('spinnerSalvar');
      const texto = document.getElementById('textoSalvar');
      
      btnSalvar.disabled = true;
      spinner.classList.remove('d-none');
      texto.textContent = 'Salvando...';

      try {
        const id = valor('agendamentoId');
        const url = id ? `${API}/agendamentos/${id}` : `${API}/agendamentos`;
        
        const res = await fetch(url, {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(obterDadosFormulario())
        });

        if (!res.ok) throw new Error('Falha ao salvar no banco.');
        
        modalInstance.hide();
        carregarAgendamentos();
        
        Swal.fire({
          title: 'Sucesso!',
          text: 'Agendamento salvo com segurança.',
          icon: 'success',
          timer: 2000,
          showConfirmButton: false
        });

      } catch (error) {
        Swal.fire('Ops!', 'Ocorreu um erro ao salvar o agendamento.', 'error');
      } finally {
        btnSalvar.disabled = false;
        spinner.classList.add('d-none');
        texto.textContent = 'Salvar Agendamento';
      }
    }

    function editarAgendamento(item) {
      abrirFormulario();
      Object.keys(item).forEach(chave => {
        const campo = document.getElementById(chave);
        if (campo) campo.value = chave === 'dataHora' && item[chave] ? item[chave].substring(0, 16) : item[chave] || '';
      });
      document.getElementById('agendamentoId').value = item.id;
      document.getElementById('tituloFormulario').textContent = 'Editar Agendamento';
    }

    async function excluirAgendamento(id) {
      const confirmacao = await Swal.fire({
        title: 'Tem certeza?',
        text: "Esta ação apagará o agendamento do banco de dados!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
      });

      if (confirmacao.isConfirmed) {
        try {
          await fetch(`${API}/agendamentos/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
          carregarAgendamentos();
          Swal.fire('Excluído!', 'O agendamento foi removido.', 'success');
        } catch(e) {
          Swal.fire('Erro!', 'Não foi possível excluir.', 'error');
        }
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    async function buscarCNPJ(e) {
      const cnpjInput = e.target.value.replace(/\D/g, '');
      if (cnpjInput.length !== 14) return;

      document.getElementById('cliente').value = "Buscando na Receita...";
      
      try {
        const res = await fetch(`https://api.allorigins.win/raw?url=https://www.receitaws.com.br/v1/cnpj/${cnpjInput}`);
        const data = await res.json();
        
        if (data.nome) {
          document.getElementById('cliente').value = data.nome;
          document.getElementById('endereco').value = `${data.logradouro || ''}, ${data.municipio || ''} - ${data.uf || ''}`.trim();
        } else {
          throw new Error("CNPJ Inválido");
        }
      } catch (error) {
        document.getElementById('cliente').value = "";
        Swal.fire('Atenção', 'Não foi possível localizar este CNPJ na Receita Federal.', 'warning');
      }
    }

    function mascaraCNPJ(e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 14);
      v = v.replace(/^(\d{2})(\d)/, '$1.$2');
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
      v = v.replace(/(\d{4})(\d)/, '$1-$2');
      e.target.value = v;
    }
    function mascaraCPF(e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      v = v.replace(/^(\d{3})(\d)/, '$1.$2');
      v = v.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
      v = v.replace(/\.(\d{3})(\d)/, '.$1-$2');
      e.target.value = v;
    }
    function mascaraPlaca(e) {
      let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
      if (v.length > 3) v = v.slice(0, 3) + '-' + v.slice(3);
      e.target.value = v;
    }
    function mascaraDI(e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 10);
      v = v.replace(/^(\d{2})(\d)/, '$1/$2');
      v = v.replace(/(\d{7})(\d)/, '$1-$2');
      e.target.value = v;
    }
  </script>
</body>
</html>
